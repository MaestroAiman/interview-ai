<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Error — InterviewAI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <h:outputStylesheet library="css" name="main.css"/>
    <h:outputStylesheet library="css" name="auth.css"/>
</h:head>
<h:body styleClass="auth-page">
    <div class="auth-container">
        <div class="auth-card card-dark text-center">
            <div style="font-size:4rem">⚠️</div>
            <h1 class="auth-title">Something went wrong</h1>
            <p class="auth-subtitle">An error occurred while processing your request.</p>
            <h:link outcome="/landing" styleClass="btn-primary-custom mt-3">
                <i class="bi bi-house-door"/> Go Home
            </h:link>
        </div>
    </div>
</h:body>
</html>
