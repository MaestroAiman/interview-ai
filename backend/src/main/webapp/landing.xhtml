<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>InterviewAI — AI-Powered Interview Practice</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=DM+Sans:wght@400;500&amp;display=swap"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <h:outputStylesheet library="css" name="main.css"/>
    <h:outputStylesheet library="css" name="auth.css"/>
</h:head>
<h:body styleClass="auth-page">

    <div class="auth-container" style="max-width:600px">
        <div class="auth-card card-dark text-center">
            <div class="auth-logo" style="font-size:3rem">🎯</div>
            <h1 class="auth-title" style="font-size:2.5rem">InterviewAI</h1>
            <p class="auth-subtitle" style="font-size:1.1rem">
                AI-powered interview practice platform.<br/>
                Get real-time feedback, improve your answers, land your dream job.
            </p>

            <div class="d-flex gap-3 justify-content-center mt-4">
                <h:link outcome="/login" styleClass="btn-primary-custom">
                    <i class="bi bi-box-arrow-in-right"/> Sign In
                </h:link>
                <h:link outcome="/register" styleClass="btn-secondary-custom">
                    <i class="bi bi-person-plus"/> Create Account
                </h:link>
            </div>

            <div class="row g-3 mt-4">
                <div class="col-4">
                    <div class="card-dark p-3">
                        <div style="font-size:1.5rem">💻</div>
                        <div class="small text-muted mt-1">Technical</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="card-dark p-3">
                        <div style="font-size:1.5rem">🤝</div>
                        <div class="small text-muted mt-1">HR</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="card-dark p-3">
                        <div style="font-size:1.5rem">📊</div>
                        <div class="small text-muted mt-1">Domain</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</h:body>
</html>
